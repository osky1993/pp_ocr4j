server:
  port: 8080

logging:
  pattern:
    # 在 Spring 默认格式基础上加 [traceId]，与响应头 X-Request-Id 对应
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [%15.15t] [%X{traceId:-}] %-40.40logger{39} : %m%n"

spring:
  application:
    name: pp-ocr4j
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# 组件级配置：资源保护 / 部署 / 安全（引擎调参见下方 mica.ai.ppocr.*）
ocr:
  model-root: models/ppocr-v6   # 模型根目录（部署时可挂载到任意路径）
  max-pixels: 40000000          # 解码后像素上限（≈6300×6300），防解码炸弹
  concurrency: 0                # 识别并发上限，0 = CPU 核数；超限立即返回 2001
  timeout-ms: 30000             # 单次识别超时，超时返回 2002
  warmup-tiers: [tiny]          # 启动预热档次（校验模型文件并各跑一次小图）
  api-keys: []                  # 空 = 鉴权关闭；非空则校验 /api/** 的 X-API-Key 头

# 模型档次（tiny/small/medium）由前端页面 / 接口 tier 参数动态切换，
# 引擎由 OcrEngineManager 按档懒加载。本配置的作用：
#   1. 三个 *-path 决定「默认档」（不传 tier 时使用，且随应用启动预加载）；
#   2. 调参项是所有档共享的基底配置（懒加载引擎会继承，仅替换模型路径）。
mica:
  ai:
    ppocr:
      enabled: true                                    # 注意：OcrEngineManager 依赖 Starter 装配的 Bean，不可关闭
      det-model-path: models/ppocr-v6/tiny/det.onnx    # 默认档：文字检测模型
      rec-model-path: models/ppocr-v6/tiny/rec.onnx    # 默认档：文字识别模型
      rec-char-dict-path: models/ppocr-v6/tiny/dict.txt
      # 可选调参项，对三档统一生效（默认 CPU 单线程，保证与 Python 参考实现 bit-exact）：
      # det-thresh: 0.3
      # det-box-thresh: 0.6
      # det-unclip-ratio: 1.5
      # rec-batch-size: 6
      # intra-op-num-threads: 1
      # inter-op-num-threads: 1
      # prefer-accelerator: false

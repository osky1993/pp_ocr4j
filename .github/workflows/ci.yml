name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # tiny 档模型与测试图随仓库提交，集成回归测试可直接运行
      - name: Build and test
        run: mvn -B --no-transfer-progress package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pp-ocr4j-jar
          path: target/pp-ocr4j-*.jar
          retention-days: 7
